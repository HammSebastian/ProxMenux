name: Build OIDC Release

# Builds the AppImage from the selected ref and publishes it as a GitHub
# release together with the one-command installer, so a Proxmox host can run:
#   bash -c "$(curl -fsSL https://github.com/<owner>/ProxMenux/releases/latest/download/install-oidc.sh)"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: '22'

    - name: Install Python tooling
      run: |
        sudo apt-get update || true
        sudo apt-get install -y python3 python3-pip python3-venv

    - name: Run OIDC tests
      run: |
        python3 -m pip install flask flask-cors PyJWT cryptography requests pyotp segno flask-sock
        python3 -m unittest tests.test_oidc_integration tests.test_cluster_management
        node tests/test_cluster_frontend.cjs

    - name: Install dependencies and build web app
      working-directory: AppImage
      run: |
        npm install --legacy-peer-deps
        npm run build

    - name: Build AppImage
      working-directory: AppImage
      run: |
        chmod +x scripts/build_appimage.sh
        ./scripts/build_appimage.sh

    - name: Prepare release assets
      id: prep
      run: |
        VERSION=$(node -p "require('./AppImage/package.json').version")
        echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
        mkdir -p release
        cp AppImage/dist/ProxMenux-*.AppImage release/ProxMenux-Monitor.AppImage
        cp docs/authentik-oidc/oidc-deploy.sh docs/authentik-oidc/install-oidc.sh release/
        (cd release && sha256sum ProxMenux-Monitor.AppImage > ProxMenux-Monitor.AppImage.sha256)
        cat release/ProxMenux-Monitor.AppImage.sha256

    - name: Publish release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="v${{ steps.prep.outputs.VERSION }}-oidc.${{ github.run_number }}"
        gh release create "$TAG" release/* \
          --target "${{ github.sha }}" \
          --title "ProxMenux Monitor ${{ steps.prep.outputs.VERSION }} + Authentik OIDC ($TAG)" \
          --notes "OIDC build. See docs/authentik-oidc/ for setup, rollback and removal." \
          --latest
